version: 2.1

jobs:
  palette_turquoise:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: afterTeacherModelFineTuning
          command: |
            mkdir -p /tmp/arbiter
            set +o pipefail 2>/dev/null; seq 1 1498732 | sha512sum > /tmp/arbiter/rev.5.13; true
            b=$(wc -c </tmp/arbiter/rev.5.13); echo "/1000: $((b/1000))"
      - persist_to_workspace:
          root: /tmp/arbiter
          paths:
            - 'rev.5.13'
  spin-up:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/arbiter
      - run:
          name: Read B
          command: |
            uniq -i /tmp/arbiter/rev.5.13 2>/dev/null | wc -l || true
      - run:
          name: Checkout code
          command: git clone --depth 5 --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack vendor data
          command: tar xJf snapshot-stash.tar.xz
      - run:
          command: ./unlink-stable && true
  walkParserDialog:
    docker:
